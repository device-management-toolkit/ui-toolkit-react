# This workflow will release new versions when required using semantic-release

name: Semantic-Release CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write # for Git to git push
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - run: rsync -a package.json README.md ./dist/
      - run: sed -i 's|"dist/index|"index|g' dist/package.json
      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@03595b5eaf44910cf239ff20904cc52d410f97d4 # v8.1.2
        with:
          semantic_version: 25.0.2 # It is recommended to specify version range for semantic-release.
        env:
          GITHUB_TOKEN: ${{ secrets.ROSIE_TOKEN }}
      - name: Publish to @open-amt-cloud-toolkit
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          NEW_RELEASE_VERSION: ${{ steps.semantic.outputs.new_release_version }}
        run: |
          echo "Publishing @open-amt-cloud-toolkit/ui-toolkit-react@$NEW_RELEASE_VERSION"

          sed -i 's/"@device-management-toolkit\/ui-toolkit-react"/"@open-amt-cloud-toolkit\/ui-toolkit-react"/' dist/package.json
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$NEW_RELEASE_VERSION\"/" dist/package.json
          cd dist
          npm publish
